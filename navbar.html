<script>
// ========== 主题切换功能 ==========
function toggleTheme() {
    const body = document.body;
    const isDark = body.classList.contains('dark');
    
    if (isDark) {
        body.classList.replace('dark', 'light');
        localStorage.setItem('theme', 'light');
    } else {
        body.classList.replace('light', 'dark');
        localStorage.setItem('theme', 'dark');
    }
}

// 初始化主题
function initTheme() {
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.body.className = savedTheme;
    
    // 为主题切换按钮添加点击事件
    const themeToggle = document.querySelector('.theme-toggle');
    if (themeToggle) {
        themeToggle.addEventListener('click', toggleTheme);
    }
}

// ========== 当前页面高亮功能 ==========
function highlightCurrentPage() {
    const currentPath = window.location.pathname;
    const currentPage = currentPath.split('/').pop() || 'index.html';
    
    // 页面ID映射
    const pageMap = {
        'index.html': 'nav-home',
        'resume.html': 'nav-resume',
        'docker-deployment.html': 'nav-articles',
        'articles.html': 'nav-articles',
        'about.html': 'nav-about',
        'contact.html': 'nav-contact',
        'resources.html': 'nav-resources',
        'tutorials.html': 'nav-tutorials',
        'portfolio.html': 'nav-portfolio'
    };
    
    // 获取当前页面对应的ID
    let activeId = pageMap[currentPage];
    
    // 如果没有匹配到，尝试匹配路径中的关键字
    if (!activeId) {
        for (const [key, value] of Object.entries(pageMap)) {
            if (currentPath.includes(key.replace('.html', ''))) {
                activeId = value;
                break;
            }
        }
    }
    
    // 高亮对应的导航链接
    if (activeId) {
        const activeLink = document.getElementById(activeId);
        if (activeLink) {
            // 移除所有active类
            document.querySelectorAll('.nav-menu a').forEach(link => {
                link.classList.remove('active');
            });
            // 添加active类到当前链接
            activeLink.classList.add('active');
        }
    }
}

// ========== 回到顶部功能 ==========
function initBackToTop() {
    const backToTopBtn = document.getElementById('back-to-top');
    
    if (!backToTopBtn) return;
    
    // 监听滚动事件
    window.addEventListener('scroll', function() {
        if (window.scrollY > 300) {
            backToTopBtn.style.display = 'flex';
        } else {
            backToTopBtn.style.display = 'none';
        }
    });
    
    // 点击回到顶部
    backToTopBtn.addEventListener('click', function() {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    });
}

// ========== 导航栏滚动效果 ==========
function initNavbarScroll() {
    const navbar = document.querySelector('.navbar');
    
    if (!navbar) return;
    
    window.addEventListener('scroll', () => {
        if (window.scrollY > 50) {
            if (document.body.classList.contains('light')) {
                navbar.style.background = 'rgba(255, 255, 255, 0.98)';
            } else {
                navbar.style.background = 'rgba(15, 23, 42, 0.98)';
            }
        } else {
            if (document.body.classList.contains('light')) {
                navbar.style.background = 'rgba(255, 255, 255, 0.95)';
            } else {
                navbar.style.background = 'rgba(15, 23, 42, 0.95)';
            }
        }
    });
}

// ========== 初始化所有功能 ==========
function initAll() {
    initTheme();
    highlightCurrentPage();
    initBackToTop();
    initNavbarScroll();
}

// 当DOM加载完成时初始化
document.addEventListener('DOMContentLoaded', initAll);

// 如果导航栏是后加载的，需要重新初始化
window.addEventListener('load', function() {
    // 检查导航栏是否已加载
    if (document.querySelector('.navbar')) {
        initAll();
    }
});
</script>
